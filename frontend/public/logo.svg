<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Backdrop -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Subtle Radial AI Glow -->
  <circle cx="256" cy="240" r="160" fill="url(#glowGrad)"/>

  <!-- Outer Kinetic Sports Ring Arc (Telemetry / Radar) -->
  <path d="M120 256 A136 136 0 1 1 392 256" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="8 16" opacity="0.75"/>
  <path d="M144 256 A112 112 0 0 0 368 256" fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 14" opacity="0.85"/>

  <!-- Main AI Sports Shield Crest -->
  <path d="M256 96 L352 144 V248 C352 316 296 376 256 404 C216 376 160 316 160 248 V144 Z" 
        fill="#090d16" 
        stroke="url(#primaryGrad)" 
        stroke-width="14" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Trophy & Sports Wings Centerpiece -->
  <path d="M216 184 H296 V232 C296 254 278 272 256 272 C234 272 216 254 216 232 Z" 
        fill="url(#primaryGrad)"/>
  
  <!-- Trophy Handles / Speed Wings -->
  <path d="M216 200 H192 C183 200 176 207 176 216 C176 232 189 244 205 244 H216" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="8" 
        stroke-linecap="round"/>
  <path d="M296 200 H320 C329 200 336 207 336 216 C336 232 323 244 307 244 H296" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="8" 
        stroke-linecap="round"/>

  <!-- Trophy Stem & Pedestal Base -->
  <path d="M251 272 H261 V308 H251 Z" fill="url(#primaryGrad)"/>
  <path d="M228 308 H284 C288 308 292 312 292 316 V324 H220 V316 C220 312 224 308 228 308 Z" fill="url(#primaryGrad)"/>

  <!-- AI Pulse Star / Sparkle in Trophy Center -->
  <path d="M256 204 L260 220 L276 224 L260 228 L256 244 L252 228 L236 224 L252 220 Z" fill="#ffffff"/>
  
  <!-- Floating AI Telemetry Sparks -->
  <circle cx="330" cy="148" r="6" fill="#a855f7"/>
  <circle cx="182" cy="148" r="6" fill="#22d3ee"/>
</svg>
